<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Клуб подій</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
    <h1 class="heading">Клуб подій</h1>
    <p>Керуйте заявками на участь у шкільних активностях</p>
    <div class="blocks">
        <section class="block form-block">
            <h2>Нова заявка</h2>
            <label for="nameInput">Ім'я учасника</label>
            <input id="nameInput" type="text" placeholder="Марія Коваль">
            <label for="eventInput">Назва події</label>
            <input id="eventInput" type="text" placeholder="Хакатон ліцею">
            <button id="addButton" type="button">+ Додати заявку</button>
        </section>
        <section class="block form-row">
            <h2>Учасники</h2>
            <p class="stat">Усього заявок: <strong id="totalCounter">0</strong></p>
            <p class="stat">Підтверджено: <strong id="confirmedCounter">0</strong></p>
            <p id="emptyText">Заявок поки немає</p>
            <ul id="requestList"></ul>
            <button id="clearButton" type="button">Очистити всі</button>
        </section>
    </div>
</main>

<script src="script.js"></script>
</body>
</html>
