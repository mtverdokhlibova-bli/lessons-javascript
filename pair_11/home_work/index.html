<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Налаштування профілю</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="profile-card" id="card">
    <p class="tag">Особистий кабінет</p>
    <h1>Налаштування профілю</h1>
    <p id="welcome">Вітаємо, користувачу!</p>

    <label for="userName">Ваше ім'я</label>
    <input type="text" id="userName" placeholder="Введіть ваше ім'я">

    <button id="confirmBtn">Підтвердити</button>
    <p id="status">Ім'я ще не підтверджено</p>

    <label for="themeSelect">Кольорова тема</label>
    <select id="themeSelect">
        <option value="light">Світла тема</option>
        <option value="dark">Темна тема</option>
    </select>
    <button id="detailsBtn" class="secondary">Показати додаткову інформацію</button>
    <p class="hidden" id="details">Цікавий факт: якщо заплющити очі, ви нічого не побачите!</p>

</main>

<script src="script.js"></script>
</body>
</html>
